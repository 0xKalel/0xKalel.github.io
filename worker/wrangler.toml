[vars]
GEMINI_MODEL = "gemini-3.5-flash"
KNOWLEDGE_URL = "https://0xkalel.github.io/ask/knowledge.txt"
ALLOWED_ORIGINS = "https://0xkalel.github.io,http://localhost:4321,http://127.0.0.1:4321"

# Requires wrangler >= 4.36; period must be 10 or 60. Enforced per Cloudflare location.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
